<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공사일지 작성</title>

    <link rel="stylesheet" href="/common.css">
</head>
<body>
<div class="container">

    <header class="page-header">
        <a href="/index.html" class="btn-main">🏠 메인으로</a>
        <div style="display:flex; gap:10px;">
            <button type="button" id="btn-download-pdf" class="btn-pdf" style="display:none; border:1px solid #e74c3c;">
                📄 PDF 다운로드
            </button>
            <a href="/log-list.html" class="btn-list">☰ 목록보기</a>
        </div>
    </header>

    <h1>공사일지 작성</h1>

    <form id="constructionLogForm">

        <div class="form-section">
            <h2>1. 기본 정보</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>회사명</label>
                    <input type="text" id="company" value="솔아이티">
                </div>

                <div class="form-group">
                    <label>작업일자</label>
                    <input type="date" id="logDate" required>
                </div>

                <div class="form-group">
                    <label>날씨 / 기온</label>
                    <input type="text" id="weather" placeholder="자동 입력 대기중...">
                </div>

                <div class="form-group">
                    <label>현장 위치</label>
                    <input type="text" id="location" value="춘천시 동보 아파트">
                </div>

                <div class="form-group">
                    <label>작성자</label>
                    <input type="text" id="author" placeholder="이름 입력">
                </div>

                <div class="form-group">
                    <label>현장 관리자</label>
                    <input type="text" id="manager" placeholder="ex:홍길동">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>2. 작업 현황</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>공종 선택</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="workTypeSelect" style="flex: 1;">
                            <option value="">-- 공종 선택 --</option>
                            <option value="가설공사">가설공사</option>
                            <option value="토공사">토공사</option>
                            <option value="기초공사">기초공사</option>
                            <option value="철근콘크리트공사">철근콘크리트공사</option>
                            <option value="철골공사">철골공사</option>
                            <option value="조적공사">조적공사</option>
                            <option value="미장/방수공사">미장/방수공사</option>
                            <option value="내장목공사">내장목공사</option>
                            <option value="창호/유리공사">창호/유리공사</option>
                            <option value="도장공사">도장공사</option>
                            <option value="전기/설비공사">전기/설비공사</option>
                            <option value="direct">직접 입력</option>
                        </select>
                        <input type="text" id="workTypeDirect" style="display: none; flex: 1;" placeholder="공종 직접 입력">
                    </div>
                </div>

                <div class="form-group">
                    <label>총 출력 인원 (명)</label>
                    <input type="number" id="workersCount" value="0">
                </div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>투입 인원 명단</label>
                <input type="text" id="workerNames" placeholder="ex:홍길동,김민수...">
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>금일 작업 내용 상세</label>
                <textarea id="workDetails" placeholder="금일 진행한 세부 작업 내용을 입력하세요."></textarea>
            </div>
        </div>

        <div class="form-section">
            <h2>3. AI 현장 분석</h2>

            <div class="form-group">
                <label style="color: #007bff; display:flex; align-items:center; gap:10px;">
                    현장 사진 업로드
                    <span style="font-size:0.8em; color:#999; font-weight:normal;">(사진을 올리고 분석 실행 버튼을 누르세요)</span>
                </label>
                <input type="file" id="photosInput" multiple accept="image/*">
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label style="margin:0;">AI 분석 결과</label>
                    <button type="button" id="btn-analyze-ai" class="ai-btn">사진 분석 실행</button>
                </div>
                <textarea id="aiWorkDescription" style="height: 120px; background: #f8f9fa;" placeholder="AI가 분석한 내용이 여기에 자동으로 입력됩니다."></textarea>
            </div>
        </div>

        <div class="form-section">
            <h2>4. 자재 및 장비</h2>
            <div class="tables-container">

                <div class="table-wrapper">
                    <div class="table-header">
                        <span>투입 장비</span>
                        <button type="button" class="row-add-btn" onclick="addEquipmentRow()">+ 추가</button>
                    </div>
                    <table id="equipmentTable">
                        <thead>
                        <tr>
                            <th>장비명</th>
                            <th style="width: 80px;">대수</th>
                            <th style="width: 60px;">관리</th>
                        </tr>
                        </thead>
                        <tbody id="equipmentTbody">
                        </tbody>
                    </table>
                </div>

                <div class="table-wrapper">
                    <div class="table-header">
                        <span>사용 자재</span>
                        <button type="button" class="row-add-btn" onclick="addMaterialRow()">+ 추가</button>
                    </div>
                    <table id="materialTable">
                        <thead>
                        <tr>
                            <th>자재명</th>
                            <th style="width: 100px;">수량</th>
                            <th style="width: 60px;">관리</th>
                        </tr>
                        </thead>
                        <tbody id="materialTbody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>5. 기타 및 서명</h2>

            <div class="form-group">
                <label>기타 첨부 파일</label>
                <input type="file" id="attachmentsInput" multiple>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>특이사항</label>
                <textarea id="remarks" placeholder="작업 중 특이사항이나 지시사항 입력"></textarea>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>관리자 서명</label>
                <div class="signature-pad-wrapper">
                    <canvas id="signature-pad"></canvas>
                </div>
                <div class="signature-pad-actions">
                    <button type="button" class="sig-btn" id="sig-save-btn">서명 저장</button>
                    <button type="button" class="sig-btn clear" id="sig-clear-btn">지우기</button>
                </div>
                <input type="file" id="signatureInput" accept="image/*" style="display: none;">
            </div>
        </div>

        <button type="button" class="submit-btn" id="finalSubmitBtn">공사일지 저장 완료</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<script src="/js/construction.js" defer></script>
</body>
</html>
