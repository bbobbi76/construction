<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 로그인</title>

    <link rel="stylesheet" href="/common.css">

    <style>
        /* --- 1. 전체 페이지 레이아웃 --- */
        body {
            /* 배경: 차분한 딥블루 대각선 그라데이션 */
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 가로 중앙 정렬 */
            align-items: center;     /* 세로 중앙 정렬 */
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }

        .login-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* --- 2. 로그인 카드 박스 디자인 --- */
        .login-box {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;       /* 너무 넓어지지 않게 제한 */
            padding: 50px 40px;     /* 내부 여백 */
            border-radius: 12px;    /* 둥근 모서리 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); /* 그림자 효과 */
            text-align: center;
        }

        /* 브랜드 아이콘 스타일 (HTML에 태그가 있다면 적용됨) */
        .brand-icon {
            width: 60px;
            height: 60px;
            background-color: #e3f2fd;
            color: #1565c0;
            font-size: 2rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* 타이틀 스타일 */
        h1 {
            font-size: 1.6rem;
            color: #333;
            margin: 0 0 10px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            margin: 0 0 40px;
            font-size: 0.95rem;
        }

        /* --- 3. 입력 폼 스타일 --- */
        .input-group {
            margin-bottom: 20px;
            text-align: left; /* 라벨 왼쪽 정렬 */
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
        }

        /* 입력창 공통 */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fdfdfd;
            font-size: 1rem;
            box-sizing: border-box; /* 테두리 포함 크기 계산 */
            transition: all 0.2s;
        }

        /* 입력창 포커스 효과 (파란색 포인트) */
        input:focus {
            border-color: #2a5298;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
            outline: none;
        }

        /* --- 4. 로그인 버튼 및 하단 링크 --- */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #1e3c72, #2a5298); /* 파란색 그라데이션 */
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px); /* 마우스 올리면 살짝 떠오름 */
        }

        .footer-links {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #888;
        }

        .footer-links a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <h1>현장 관리 시스템</h1>
        <p class="subtitle">스마트한 건설 안전 관리의 시작</p>

        <form action="/login" method="post">

            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디 입력" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
            </div>

            <button type="submit" class="submit-btn">로그인</button>
        </form>

        <div class="footer-links">
            계정이 없으신가요? <a href="/signup.html">회원가입</a>
        </div>
    </div>
</div>

</body>
</html>
